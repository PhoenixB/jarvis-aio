name: Release

# Publishes a GitHub Release whenever the integration's manifest version lands on
# main without a matching release yet. It is idempotent: every push to main
# checks whether a release for the current manifest version already exists and
# only creates one when it doesn't, so re-runs, unrelated pushes, and releases
# cut by hand never produce a duplicate. Trigger it manually (workflow_dispatch)
# to release the current version on demand — e.g. right after adding this file.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # create tags + releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release on version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: ver
        run: |
          v=$(python3 -c "import json;print(json.load(open('custom_components/jarvis/manifest.json'))['version'])")
          if [ -z "$v" ]; then echo "manifest has no version" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $v"

      - name: Check whether this release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.ver.outputs.version }}" \
               --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.version }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.exists.outputs.exists == 'false'
        run: |
          python3 scripts/extract_changelog.py "${{ steps.ver.outputs.version }}" > release-notes.md
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create the release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "JARVIS AIO v.${{ steps.ver.outputs.version }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
          echo "Published JARVIS AIO v.${{ steps.ver.outputs.version }}"
